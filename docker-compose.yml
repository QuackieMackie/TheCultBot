services:
  cultbot:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID:?set CLIENT_ID}
      GUILD_ID: ${GUILD_ID:?set GUILD_ID}
    volumes:
      - /srv/containers/thecults/discord:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
